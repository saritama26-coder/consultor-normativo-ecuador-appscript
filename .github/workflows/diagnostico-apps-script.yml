name: Diagnóstico de Apps Script (solo lectura)
on:
  push:
    branches: ['diag/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar clasp (versión fija)
        run: npm install -g @google/clasp@3.4.1
      - name: Descargar el proyecto actual de Apps Script (sin modificarlo)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          mkdir -p "$RUNNER_TEMP/remoto"
          node -e 'const c=JSON.parse(process.env.CLASP_JSON);process.stdout.write(JSON.stringify({scriptId:c.scriptId,rootDir:"."}))' > "$RUNNER_TEMP/remoto/.clasp.json"
          cd "$RUNNER_TEMP/remoto"
          clasp pull
          echo "Archivos en Apps Script:"; ls -la
      - name: Comparar con el repositorio
        run: |
          R="$RUNNER_TEMP/remoto"
          for par in "Código.js:Codigo.gs" "Clasificador.js:Clasificador.gs" "Index.html:Index.html"; do
            a="$R/${par%%:*}"; b="${par##*:}"
            echo "=================== ${par%%:*} (Apps Script)  vs  $b (repo): $(diff --strip-trailing-cr "$a" "$b" | grep -c '^[<>]') líneas distintas"
            diff --strip-trailing-cr "$a" "$b" | cut -c1-220 | head -80 || true
          done
      - name: Guardar respaldo del proyecto de Apps Script
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-apps-script
          path: ${{ runner.temp }}/remoto/
          retention-days: 90
          include-hidden-files: false
