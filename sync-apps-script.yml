name: Sincronizar Google Apps Script
on:
  push:
    branches: [main]
    paths:
      - 'Codigo.gs'
      - 'Index.html'
      - 'Clasificador.gs'
      - 'appsscript.json'
      - '.github/workflows/sync-apps-script.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar clasp
        run: npm install -g @google/clasp
      - name: Configurar autenticación de clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Falta el secreto CLASPRC_JSON" && exit 1)
          test -n "$CLASP_JSON" || (echo "Falta el secreto CLASP_JSON" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
      - name: Validar proyecto
        run: |
          test -f Codigo.gs
          test -f Index.html
          test -f appsscript.json
      - name: Sincronizar archivos con Apps Script
        run: clasp push
